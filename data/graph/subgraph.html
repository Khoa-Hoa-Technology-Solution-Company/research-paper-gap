 15, "title": "Type: CONCEPT"}, {"color": "#EF4444", "id": "prepositioning of medical staff and emergency crew", "label": "prepositioning of medical staff and emergency crew", "shape": "dot", "size": 25, "title": "Type: CONCEPT"}, {"color": "#EF4444", "id": "taxonomy", "label": "taxonomy", "shape": "dot", "size": 25, "title": "Type: METHOD"}, {"color": "#3B82F6", "id": "comprehensive literature search", "label": "comprehensive literature search", "shape": "dot", "size": 15, "title": "Type: METHOD"}, {"color": "#3B82F6", "id": "transition probabilities between childhood dental health states", "label": "transition probabilities between childhood dental health states", "shape": "dot", "size": 15, "title": "Type: CONCEPT"}]);

};
